<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VisionLance — creative websites and digital experiences for growing ideas.">
  <title>VisionLance | Websites That Move Ideas Forward</title>
  <style>
    :root {
      --bg: #080d19; --panel: #101a2d; --panel2: #14213a;
      --text: #f4f7ff; --muted: #aab6cc; --blue: #65a9ff;
      --yellow: #ffd45c; --line: rgba(255,255,255,.12);
      --brand-navy: #071b3b; --brand-cyan: #00c5e9;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; font-family: Inter, ui-sans-serif, system-ui, Arial, sans-serif;
      color: var(--text); background:
        radial-gradient(circle at 85% 5%, rgba(55,119,220,.22), transparent 30%),
        radial-gradient(circle at 5% 40%, rgba(255,212,92,.08), transparent 25%), var(--bg);
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(1100px, 90%); margin: auto; }
    header {
      position: sticky; top: 0; z-index: 5;
      background: rgba(232, 246, 253, .97);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(7, 27, 59, .10);
      box-shadow: 0 5px 24px rgba(7, 27, 59, .10);
    }
    nav { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .logo { font-size: 1.42rem; font-weight: 900; letter-spacing: -.9px; color: var(--brand-navy); white-space: nowrap; }
    .logo span { color: var(--brand-cyan); }
    .navlinks { display: flex; gap: 28px; color: #28415f; font-size: .94rem; font-weight: 650; }
    .navlinks a { transition: color .2s ease; }
    .navlinks a:hover { color: #008eae; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 19px; border-radius: 12px; font-weight: 800; background: var(--brand-cyan); color: #06172d; transition: transform .2s, filter .2s; box-shadow: 0 7px 20px rgba(0,197,233,.16); }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .btn.outline { background: transparent; color: #eaf4ff; border: 1px solid rgba(0,197,233,.48); box-shadow: none; }
    .hero { padding: 100px 0 88px; display: grid; grid-template-columns: 1.2fr .8fr; gap: 50px; align-items: center; }
    .eyebrow { color: var(--yellow); text-transform: uppercase; letter-spacing: 2px; font-size: .78rem; font-weight: 800; }
    h1 { font-size: clamp(2.7rem, 6vw, 5.2rem); line-height: 1.04; letter-spacing: -3px; margin: 17px 0 22px; }
    h1 span { color: var(--blue); }
    .lead { color: var(--muted); font-size: 1.12rem; max-width: 580px; }
    .actions { display: flex; flex-wrap: wrap; gap: 13px; margin-top: 30px; }
    .hero-card { border: 1px solid var(--line); border-radius: 24px; padding: 28px; background: linear-gradient(145deg, rgba(20,33,58,.95), rgba(12,20,36,.9)); box-shadow: 0 25px 80px rgba(0,0,0,.25); }
    .orb { width: 100%; aspect-ratio: 1.25; border-radius: 18px; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #274d83, #111d34 65%); overflow: hidden; }
    .orb-mark { font-size: clamp(3rem, 8vw, 6rem); font-weight: 950; letter-spacing: -8px; color: var(--yellow); text-shadow: 0 0 35px rgba(101,169,255,.55); }
    .mini-stats { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; margin-top: 15px; }
    .stat { padding: 14px; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 13px; }
    .stat strong { display: block; font-size: 1.05rem; } .stat small { color: var(--muted); }
    section { padding: 72px 0; }
    .section-head { max-width: 650px; margin-bottom: 30px; }
    h2 { font-size: clamp(2rem,4vw,3rem); line-height: 1.15; margin: 9px 0 12px; letter-spacing: -1.4px; }
    .muted { color: var(--muted); }
    .cards { display: grid; grid-template-columns: repeat(3,1fr); gap: 17px; }
    .card { background: rgba(16,26,45,.82); border: 1px solid var(--line); border-radius: 18px; padding: 23px; }
    .card .icon { font-size: 1.7rem; }
    .card h3 { margin: 12px 0 7px; }
    .project { min-height: 210px; display: flex; flex-direction: column; justify-content: space-between; background: linear-gradient(145deg, #172c4c, #101827); }
    .project-tag { color: var(--yellow); font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    .project a { color: var(--blue); font-weight: 700; }
    .about-grid { display: grid; grid-template-columns: .9fr 1.1fr; gap: 30px; align-items: start; }
    .highlight { border-left: 3px solid var(--yellow); padding: 5px 0 5px 18px; color: var(--muted); }
    .contact { text-align: center; border: 1px solid var(--line); border-radius: 24px; padding: 48px 24px; background: linear-gradient(135deg, rgba(20,33,58,.95), rgba(12,20,36,.95)); }
    .contact p { max-width: 570px; margin: 0 auto 24px; color: var(--muted); }
    footer { padding: 28px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
    footer .wrap { display: flex; justify-content: space-between; gap: 15px; flex-wrap: wrap; }
    @media (max-width: 760px) {
      .hero, .about-grid { grid-template-columns: 1fr; }
      .hero { padding: 70px 0 55px; gap: 30px; }
      .cards { grid-template-columns: 1fr; }
      .navlinks { gap: 12px; font-size: .82rem; }
      nav > .btn { display: none; }
      h1 { letter-spacing: -2px; }
    }
    @media (max-width: 420px) { nav { gap: 10px; } .logo { font-size: 1.12rem; } .navlinks { gap: 10px; } .navlinks a { font-size: .76rem; } }
  </style>
</head>
