  --bg:#080f20; --bg2:#0d1830; --card:#101e38;
  --blue:#42aaff; --cyan:#65d5ff; --white:#f4f8ff; --muted:#9aabc4;
  --border:rgba(140,190,255,.13);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:85px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--white);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font:inherit}
img{max-width:100%;display:block}
.container{width:min(1140px,90%);margin:auto}
::selection{background:var(--blue);color:#fff}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}

body::before{content:"";position:fixed;width:600px;height:600px;top:-250px;left:-200px;background:radial-gradient(circle,rgba(35,116,255,.13),transparent 70%);pointer-events:none;z-index:-1}
body::after{content:"";position:fixed;width:600px;height:600px;right:-350px;bottom:-300px;background:radial-gradient(circle,rgba(0,192,255,.10),transparent 70%);pointer-events:none;z-index:-1}

/* NAV */
header{position:fixed;top:0;left:0;width:100%;z-index:1000;background:rgba(8,15,32,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--border);transition:.3s}
header.scrolled{background:rgba(8,15,32,.95);box-shadow:0 10px 40px rgba(0,0,0,.35)}
nav{min-height:78px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px}
.logo-img{background:var(--logo) center/contain no-repeat;flex:none}
.brand .logo-img{width:44px;height:44px}
.brand-name{font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:700;letter-spacing:-1px}
.brand-name span:first-child{color:#f3f7ff}
.brand-name span:last-child{color:var(--blue)}
.nav-links{display:flex;align-items:center;gap:31px}
.nav-links a{color:#c1cde0;font-size:13px;transition:.25s}
.nav-links a:hover{color:var(--cyan)}
.nav-links a.nav-contact{padding:12px 20px;border-radius:8px;background:linear-gradient(110deg,#2789ee,#48c5ff);color:#04101e;font-weight:800}
.nav-links a.nav-contact:hover{color:#04101e;transform:translateY(-2px)}
.menu-btn{display:none;background:none;color:#fff;border:0;font-size:27px;cursor:pointer}

/* HERO */
.hero{min-height:780px;display:flex;align-items:center;padding:145px 0 85px}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:55px}
.eyebrow{display:inline-flex;align-items:center;gap:9px;padding:9px 14px;border:1px solid rgba(75,175,255,.27);border-radius:50px;color:#80cbff;font-size:12px;background:rgba(42,135,255,.07);margin-bottom:27px}
.dot{width:7px;height:7px;background:#43d7a0;border-radius:50%;box-shadow:0 0 12px #43d7a0}
.hero h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(43px,6.2vw,76px);line-height:1.06;letter-spacing:-4px;margin-bottom:24px}
.gradient{background:linear-gradient(100deg,#51b5ff,#8de3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-description{max-width:490px;color:var(--muted);line-height:1.9;font-size:15px;margin-bottom:33px}
.actions{display:flex;gap:14px;flex-wrap:wrap}
.btn{padding:15px 23px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;font-size:13px;font-weight:700;transition:.3s;cursor:pointer;border:0}
.btn-primary{color:#061326;background:linear-gradient(110deg,#2995ff,#65d7ff);box-shadow:0 10px 35px rgba(43,148,255,.17)}
.btn-primary:hover{transform:translateY(-4px);box-shadow:0 15px 40px rgba(43,148,255,.3)}
.btn-secondary{border:1px solid rgba(130,190,255,.28);color:#fff;background:transparent}
.btn-secondary:hover{background:rgba(65,160,255,.12)}
.hero-trust{display:flex;gap:26px;margin-top:38px;flex-wrap:wrap}
.hero-trust div{font-size:12px;color:#8fa6c4;display:flex;align-items:center;gap:8px}
.hero-trust b{color:var(--cyan)}

.hero-visual{position:relative;min-height:420px;display:flex;align-items:center;justify-content:center}
.visual-glow{position:absolute;width:340px;height:340px;border-radius:50%;background:#168fff;opacity:.12;filter:blur(90px)}
.dashboard{position:relative;width:100%;max-width:470px;background:linear-gradient(145deg,#142746,#0b172c);border:1px solid rgba(116,183,255,.22);border-radius:19px;padding:21px;box-shadow:0 30px 100px rgba(0,0,0,.4);transform:rotate(-2deg);animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(-1deg)}}
.dash-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;color:#d8e8ff;font-size:12px}
.dash-dots{display:flex;gap:5px}
.dash-dots i{width:7px;height:7px;border-radius:50%;background:#51b5ff}
.dash-label{color:#7e9bbb;font-size:10px;letter-spacing:2px;margin-bottom:10px}
.dash-title{font-family:'Space Grotesk',sans-serif;font-size:27px;font-weight:700;margin-bottom:20px}
.dash-title span{color:var(--blue)}
.dash-box{border:1px solid var(--border);background:rgba(255,255,255,.025);padding:16px;border-radius:11px;margin-top:12px}
.dash-box strong{display:block;font-size:13px;margin-bottom:6px}
.dash-box small{color:#92a7c3;font-size:10px}
.dash-bars{display:flex;align-items:end;gap:9px;height:90px;margin-top:20px}
.dash-bars i{flex:1;border-radius:5px 5px 0 0;background:linear-gradient(to top,#217ce5,#5cd1ff)}
.dash-bars i:nth-child(1){height:35%}.dash-bars i:nth-child(2){height:60%}.dash-bars i:nth-child(3){height:45%}
.dash-bars i:nth-child(4){height:85%}.dash-bars i:nth-child(5){height:65%}.dash-bars i:nth-child(6){height:100%}
.floating-tag{position:absolute;right:-12px;bottom:42px;padding:14px 18px;background:#142b4a;border:1px solid var(--border);border-radius:12px;color:#a8ddff;font-size:12px;box-shadow:0 12px 40px #0005}

/* COMMON */
section{padding:100px 0}
.section-head{max-width:620px;margin:0 auto 52px;text-align:center}
.section-label{color:var(--blue);text-transform:uppercase;letter-spacing:3px;font-size:11px;font-weight:800;margin-bottom:14px}
.section-head h2{font-family:'Space Grotesk',sans-serif;font-size:clamp(30px,4vw,44px);letter-spacing:-1.8px;margin-bottom:16px;line-height:1.12}
.section-head p{color:var(--muted);line-height:1.8;font-size:14px}

/* STATS */
.stats{padding:0 0 30px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);border-radius:16px;background:linear-gradient(145deg,#0f1d36,#0b162a);overflow:hidden}
.stat{padding:28px 20px;text-align:center;border-right:1px solid var(--border)}
.stat:last-child{border-right:0}
.stat strong{display:block;font-family:'Space Grotesk',sans-serif;font-size:32px;color:var(--cyan);letter-spacing:-1px}
.stat span{font-size:12px;color:var(--muted)}

/* SERVICES */
.services{background:linear-gradient(180deg,transparent,rgba(18,39,70,.35),transparent)}
.service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:19px}
.service-card{background:linear-gradient(145deg,#11213c,#0c172b);border:1px solid var(--border);border-radius:15px;padding:29px;transition:.35s;position:relative;overflow:hidden}
.service-card::before{content:"";position:absolute;width:130px;height:130px;right:-70px;top:-70px;border-radius:50%;background:rgba(54,153,255,.13);filter:blur(20px)}
.service-card:hover{transform:translateY(-8px);border-color:rgba(75,178,255,.5)}
.service-icon{width:48px;height:48px;display:grid;place-items:center;background:rgba(49,150,255,.12);border:1px solid rgba(68,165,255,.2);border-radius:12px;font-size:22px;margin-bottom:24px;color:var(--cyan)}
.service-card h3{font-family:'Space Grotesk',sans-serif;font-size:19px;margin-bottom:12px}
.service-card p{color:var(--muted);font-size:13px;line-height:1.8}
.coming{display:inline-block;font-size:9px;color:#8bd6ff;border:1px solid rgba(84,186,255,.3);background:rgba(47,145,255,.1);padding:5px 9px;border-radius:30px;margin-top:16px;letter-spacing:1px}

/* PROCESS */
.process-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:19px;counter-reset:step}
.step{position:relative;padding:28px 24px;border:1px solid var(--border);border-radius:15px;background:rgba(255,255,255,.02)}
.step::before{counter-increment:step;content:"0" counter(step);font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;background:linear-gradient(100deg,#3b9bff,#8de3ff);-webkit-background-clip:text;background-clip:text;color:transparent;display:block;margin-bottom:14px}
.step h3{font-family:'Space Grotesk',sans-serif;font-size:17px;margin-bottom:10px}
.step p{color:var(--muted);font-size:12.5px;line-height:1.75}

/* PROJECTS */
.project-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:23px}
.project-card{overflow:hidden;background:var(--card);border:1px solid var(--border);border-radius:15px;transition:.3s}
.project-card:hover{transform:translateY(-6px);border-color:rgba(75,178,255,.4)}
.project-preview{min-height:220px;padding:25px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#112c50,#101b33)}
.project-preview.alt{background:linear-gradient(135deg,#0f3a52,#101b33)}
.project-preview.alt2{background:linear-gradient(135deg,#1d2b66,#101b33)}
.project-preview.alt3{background:linear-gradient(135deg,#0d4258,#0f1c36)}
.preview-window{width:90%;border-radius:10px;overflow:hidden;border:1px solid #ffffff25;background:#09152a;box-shadow:0 15px 40px #0005}
.preview-header{height:22px;background:#1b3555;display:flex;align-items:center;gap:4px;padding-left:10px}
.preview-header i{height:5px;width:5px;border-radius:50%;background:#64baff}
.preview-content{padding:23px}
.preview-content strong{display:block;font-family:'Space Grotesk',sans-serif;font-size:19px;margin-bottom:9px}
.preview-content span{display:block;font-size:9px;color:#9bb3d3}
.preview-line{height:7px;width:65%;background:#317fca;border-radius:10px;margin-top:15px}
.preview-line.short{width:40%}
.preview-chart{display:flex;align-items:end;gap:6px;height:44px;margin-top:16px}
.preview-chart i{flex:1;background:linear-gradient(to top,#2a7fe0,#62d0ff);border-radius:3px 3px 0 0}
.preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}
.preview-grid i{height:34px;border-radius:5px;background:#1c4472}
.project-info{padding:22px}
.project-info h3{font-size:17px;margin-bottom:8px}
.project-info p{color:var(--muted);font-size:12px;line-height:1.7}
.project-type{color:#65c6ff;font-size:10px;letter-spacing:1px;margin-bottom:10px;display:block}
.project-note{margin-top:22px;color:#8499b7;text-align:center;font-size:11px}

/* WHY */
.why-grid{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:60px}
.why-content h2{font-family:'Space Grotesk',sans-serif;font-size:40px;letter-spacing:-1.8px;margin-bottom:19px;line-height:1.12}
.why-content>p{color:var(--muted);font-size:14px;line-height:1.9;margin-bottom:28px}
.feature{display:flex;gap:14px;margin:20px 0}
.feature-icon{min-width:36px;height:36px;display:grid;place-items:center;color:var(--cyan);background:#15365a;border-radius:9px}
.feature h4{font-size:13px;margin-bottom:5px}
.feature p{color:var(--muted);font-size:11.5px;line-height:1.6}
.why-panel{border:1px solid var(--border);background:linear-gradient(145deg,#142847,#0b172c);border-radius:18px;padding:34px;box-shadow:0 20px 70px #0003}
.why-panel h3{font-family:'Space Grotesk',sans-serif;font-size:24px;margin-bottom:15px}
.why-panel p{color:var(--muted);font-size:13px;line-height:1.8}
.why-highlight{padding:17px;border:1px solid var(--border);background:#ffffff05;border-radius:11px;margin-top:20px;color:#a8dfff;font-size:13px}

/* TECH */
.tech-row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.tech-row span{padding:11px 18px;border:1px solid var(--border);border-radius:50px;font-size:12.5px;color:#bcd0ea;background:rgba(255,255,255,.025);transition:.25s}
.tech-row span:hover{border-color:rgba(75,178,255,.5);color:var(--cyan)}

/* PACKAGES */
.price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:19px;align-items:stretch}
.price-card{padding:32px 28px;border:1px solid var(--border);border-radius:16px;background:linear-gradient(145deg,#11213c,#0c172b);display:flex;flex-direction:column;position:relative}
.price-card.featured{border-color:rgba(80,180,255,.55);background:linear-gradient(145deg,#15335b,#0d1b33);box-shadow:0 25px 70px rgba(30,120,230,.18)}
.badge{position:absolute;top:-12px;left:28px;background:linear-gradient(110deg,#2995ff,#65d7ff);color:#04101e;font-size:10px;font-weight:800;letter-spacing:1px;padding:5px 12px;border-radius:30px}
.price-card h3{font-family:'Space Grotesk',sans-serif;font-size:20px;margin-bottom:8px}
.price-card .desc{color:var(--muted);font-size:12.5px;line-height:1.7;margin-bottom:20px}
.price-card ul{list-style:none;margin-bottom:26px;flex:1}
.price-card li{font-size:13px;color:#c9d7ea;padding:9px 0;border-bottom:1px solid var(--border);display:flex;gap:10px}
.price-card li::before{content:"✓";color:var(--cyan);font-weight:700}
.price-note{margin-top:22px;text-align:center;color:#8499b7;font-size:11.5px}

/* ABOUT */
.about{background:linear-gradient(180deg,transparent,#10203b55,transparent)}
.about-card{max-width:850px;margin:auto;padding:45px;border:1px solid var(--border);border-radius:18px;background:linear-gradient(145deg,#122440,#0c172a);text-align:center}
.about-logo{width:130px;height:130px;margin:0 auto 24px}
.about-card h3{font-family:'Space Grotesk',sans-serif;font-size:28px;margin-bottom:16px}
.about-card p{max-width:650px;margin:auto;color:var(--muted);font-size:14px;line-height:2}
.founder{margin-top:29px;padding-top:24px;border-top:1px solid var(--border)}
.founder small{display:block;color:#8196b5;font-size:11px;letter-spacing:2px;margin-bottom:8px}
.founder strong{font-family:'Space Grotesk',sans-serif;color:#70caff;font-size:20px}

/* FAQ */
.faq{max-width:780px;margin:auto}
.faq details{border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.02);margin-bottom:12px;overflow:hidden}
.faq summary{padding:19px 22px;cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--cyan);font-size:20px;line-height:1;transition:.25s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 22px 20px;color:var(--muted);font-size:13px;line-height:1.85}

/* CONTACT */
.contact-wrap{display:grid;grid-template-columns:.9fr 1.1fr;gap:34px;max-width:1000px;margin:auto}
.contact-info{padding:38px 32px;border:1px solid rgba(80,173,255,.25);border-radius:19px;background:radial-gradient(ellipse at top,#153d65 0%,#10213b 55%,#0b172b 100%)}
.contact-info h2{font-family:'Space Grotesk',sans-serif;font-size:clamp(28px,3.4vw,38px);letter-spacing:-1.5px;margin-bottom:15px;line-height:1.12}
.contact-info p{color:#a8bbd5;font-size:13px;line-height:1.8;margin-bottom:24px}
.contact-line{display:flex;gap:12px;align-items:center;margin-top:14px;font-size:13px;color:#cfe3fa;word-break:break-word}
.contact-line b{width:34px;height:34px;min-width:34px;display:grid;place-items:center;background:#15365a;border-radius:9px;color:var(--cyan);font-weight:400}
.contact-form{padding:34px;border:1px solid var(--border);border-radius:19px;background:linear-gradient(145deg,#11213c,#0c172b)}
